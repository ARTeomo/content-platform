# ---------------------------------------------------------------------------
# CI — Content Platform
#
# Runs on every push to main and on every pull request targeting main.
#
# The job:
#   1. Installs the pnpm workspace with a frozen lockfile
#   2. Verifies code formatting
#   3. Runs the TypeScript compiler in --noEmit mode
#   4. Runs the test suite
#
# ESLint is intentionally excluded. The project pins TypeScript 7.0.2
# via pnpm-workspace.yaml, and typescript-eslint@8.x does not yet
# support the TS 7 compiler API. Running `pnpm lint` locally fails at
# module load with "typescript-eslint does not support TS 7.0".
# Tracked upstream at:
#   https://github.com/typescript-eslint/typescript-eslint/issues/10940
# Re-enable the lint step once a compatible typescript-eslint release
# ships.
#
# The DB- and Redis-backed tests require the TEST_DATABASE_URL and
# TEST_REDIS_URL repository secrets. When those are absent, those tests
# self-skip via the `describe.skipIf(!TEST_DB_URL)` pattern and the job
# still passes with the non-DB tests.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          # Empty strings when the secrets are not configured. The test
          # suite detects this and skips the DB- and Redis-backed tests.
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_REDIS_URL: ${{ secrets.TEST_REDIS_URL }}

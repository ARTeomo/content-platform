# ---------------------------------------------------------------------------
# CI — Content Platform
#
# Runs on every push to any branch and on every pull request targeting
# main.
#
# The job:
#   1. Installs the pnpm workspace with a frozen lockfile
#   2. Verifies code formatting
#   3. Runs the TypeScript compiler in --noEmit mode
#   4. Builds every workspace package (pnpm build)
#   5. Runs ESLint (blocking; 0 errors enforced, warnings non-blocking)
#   6. Runs the test suite
#
# The DB- and Redis-backed tests run against ephemeral service
# containers (PostgreSQL 18 + Redis 7) provisioned per job. The
# workflow sets TEST_DATABASE_URL / TEST_REDIS_URL to the local
# container endpoints and applies all migrations before the test step,
# so the gated suites always execute in CI. Locally, when those
# variables are unset, the same tests self-skip via the
# `describe.skipIf(!TEST_DB_URL)` pattern and the suite still passes
# with the non-DB tests.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: content
          POSTGRES_PASSWORD: content
          POSTGRES_DB: content_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U content -d content_platform_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DATABASE_URL: postgresql://content:content@localhost:5432/content_platform_test
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify test service endpoints are local
        run: |
          node -e "
          for (const name of ['TEST_DATABASE_URL', 'TEST_REDIS_URL']) {
            const value = process.env[name];
            if (!value) {
              console.error('FAIL: ' + name + ' is missing or empty');
              process.exit(1);
            }
            const host = new URL(value).hostname;
            if (host !== 'localhost' && host !== '127.0.0.1') {
              console.error('FAIL: ' + name + ' points at a non-local host');
              process.exit(1);
            }
            console.log('PASS: ' + name + ' endpoint is local');
          }
          "

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Apply migrations to test database
        run: pnpm --filter @content-platform/database db:migrate
        env:
          DATABASE_URL: postgresql://content:content@localhost:5432/content_platform_test

      - name: FK catalog capture
        run: |
          pnpm --filter @content-platform/database exec node --input-type=module -e "import postgres from 'postgres'; const sql = postgres(process.env.TEST_DATABASE_URL); const v = await sql\`select version() as v\`; console.log('VERSION:', v[0].v); for (const c of await sql\`select conname, confdeltype, condeferrable, condeferred, pg_get_constraintdef(oid) as def from pg_constraint where contype='f' and confrelid='destinations'::regclass order by conname\`) console.log('FK:', JSON.stringify(c)); const j = await sql\`select count(*)::int as n from drizzle.__drizzle_migrations\`; console.log('JOURNAL_COUNT:', j[0].n); await sql.end();"

      - name: Test
        run: pnpm test

packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  typescript: 5.9.3

# Resolve optional native dependencies for multiple platforms so that
# the same lockfile works on Windows (local development), Linux (CI),
# and macOS (future contributors). At install time, pnpm downloads only
# the variant matching the current process.platform / process.arch; the
# other entries are still recorded in pnpm-lock.yaml, which is what
# allows `--frozen-lockfile` to succeed on every platform.
supportedArchitectures:
  os:
    - win32
    - linux
    - darwin
  cpu:
    - x64
    - arm64

allowBuilds:
  esbuild: true
  msgpackr-extract: true
